[package]
name = "haiti-lite-rust"
version = "0.1.0"
edition = "2024"
authors = ["Aristore"]
description = "A lightweight Rust-native JSON hash identification tool"
homepage = "https://www.aristore.top/"
license = "MIT"
repository = "https://www.aristore.top/"
readme = "README.md"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
fancy-regex = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
