name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object { $_.name -eq "haiti-lite-rust" })[0]
          if ($null -eq $package) {
            throw "haiti-lite-rust package was not found"
          }
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:GITHUB_REF_NAME -ne $env:VERSION) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match Cargo.toml version '$env:VERSION'"
          }

      - name: Build Windows x64 executable
        run: cargo build --locked --release --target $env:TARGET

      - name: Prepare portable release files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $staging = "dist\haiti-lite-rust-windows-x64"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target\$env:TARGET\release\haiti-lite-rust.exe" $staging
          Copy-Item README.md, LICENSE.txt, UPSTREAM-LICENSE.txt $staging
          Compress-Archive -Path $staging -DestinationPath "dist\haiti-lite-rust-$env:VERSION-windows-x64.zip" -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/haiti-lite-rust-windows-x64/haiti-lite-rust.exe
            dist/haiti-lite-rust-${{ steps.version.outputs.version }}-windows-x64.zip

      - name: Clean build and Cargo caches
        if: always()
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path $env:GITHUB_WORKSPACE "target"),
            (Join-Path $env:USERPROFILE ".cargo\registry\cache"),
            (Join-Path $env:USERPROFILE ".cargo\registry\src"),
            (Join-Path $env:USERPROFILE ".cargo\git")
          )
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
